name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: locked baseline
            bun-version: 1.3.14
          - lane: current compatibility
            bun-version: 1.4.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Report selected toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "${{ matrix.bun-version }}"
          bun --version
          command -v cc
          cc --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Self-test CI assertion helper
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --self-test
      - name: Assert installed library exports without install
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --existing
      - name: Verify
        run: bun run ci
      - name: Inspect package contents
        run: bun pm pack --dry-run
      - name: Tarball install and import smoke (provider-free)
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts
