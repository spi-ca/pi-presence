name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: latest stable Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        id: setup-bun
        with:
          bun-version: latest
      - name: Report selected toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "${{ steps.setup-bun.outputs.bun-version }}"
          bun -e 'if (!Bun.semver.satisfies(Bun.version, ">=1.4.2")) throw new Error(`Bun >=1.4.2 required, got ${Bun.version}`)'
          bun --version
          command -v cc
          cc --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Self-test CI assertion helper
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --self-test
      - name: Assert installed library exports without install
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts --existing
      - name: Verify
        run: bun run ci
      - name: Inspect package contents
        run: bun pm pack --dry-run
      - name: Tarball install and import smoke (provider-free)
        run: env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" CI=1 PI_GRAPH_EXPECTED='{}' PI_OFFLINE=1 bun .github/scripts/package-smoke.ts
